name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        # FFmpeg major must match FFmpeg.AutoGen (8.x); ffmpeg@8 is keg-only, so link it into /opt/homebrew/lib.
        run: |
          brew install ffmpeg@8
          brew link --force ffmpeg@8
      - name: Cache FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-win64-${{ hashFiles('build/fetch-ffmpeg.ps1') }}
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: ./build/fetch-ffmpeg.ps1
      - name: Build
        run: dotnet build DualPlayer.slnx
      - name: Test
        run: dotnet test DualPlayer.slnx
      - name: Lint
        run: dotnet format DualPlayer.slnx --verify-no-changes
